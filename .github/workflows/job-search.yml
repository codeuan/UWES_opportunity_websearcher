name: Daily job search

on:
  schedule:
    - cron: "0 8,9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-job-search
  cancel-in-progress: false

jobs:
  search:
    # The schedule uses UTC. Pick the run that matches 09:00 in London.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.schedule == '0 8,9 * * *')
    runs-on: ubuntu-latest

    steps:
      - name: Check UK time
        id: clock
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$(TZ=Europe/London date +%H)" == "09" ]]; then
            echo "run_search=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.clock.outputs.run_search == 'true'

      - uses: actions/setup-python@v5
        if: steps.clock.outputs.run_search == 'true'
        with:
          python-version: "3.14"

      - name: Install dependencies
        if: steps.clock.outputs.run_search == 'true'
        run: python -m pip install requests beautifulsoup4

      - name: Run scraper
        id: scraper
        if: steps.clock.outputs.run_search == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python src/main.py

      - name: Save posted job URLs
        if: >-
          ${{ !cancelled() &&
              (steps.scraper.outcome == 'success' || steps.scraper.outcome == 'failure') }}
        run: |
          if [[ -f src/posted_jobs.json ]]; then
            git add src/posted_jobs.json
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Record jobs posted to Discord"
              git push #automatically record jobs already posted and update the repo.
            fi
          fi
